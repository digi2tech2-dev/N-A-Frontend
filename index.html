    <script>
      (function () {
        try {
          var theme = window.localStorage.getItem('kanz-coins-theme');
          var safeTheme = theme === 'light' || theme === 'dark' ? theme : 'dark';
          document.documentElement.classList.toggle('dark', safeTheme === 'dark');
          document.documentElement.dataset.theme = safeTheme;
        } catch (error) {
          document.documentElement.classList.add('dark');
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
    <style>
      #app-boot-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 50% 44%, rgb(25 214 255 / 0.16), transparent 34%),
          radial-gradient(circle at 8% 0%, rgb(8 125 255 / 0.2), transparent 38%),
          radial-gradient(circle at 92% 100%, rgb(168 85 247 / 0.13), transparent 38%),
          linear-gradient(180deg, #020b1d 0%, #010713 100%);
        transition: opacity 280ms ease, visibility 280ms ease;
      }

      #app-boot-loader.is-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .boot-loader__content {
        display: grid;
        justify-items: center;
        gap: 12px;
        width: min(220px, 72vw);
      }

      .boot-loader__mark {
        position: relative;
        display: grid;
        width: clamp(112px, 24vw, 144px);
        height: clamp(112px, 24vw, 144px);
        place-items: center;
      }

      .boot-loader__mark::before,
      .boot-loader__mark::after {
        content: "";
        position: absolute;
        inset: 5px;
        border: 1px solid rgb(121 234 255 / 0.3);
        border-radius: 50%;
        box-shadow: 0 0 26px rgb(25 214 255 / 0.12), inset 0 0 22px rgb(8 125 255 / 0.07);
        animation: boot-ring-pulse 1.8s ease-out infinite;
      }

      .boot-loader__mark::after {
        inset: 17px;
        border-color: rgb(168 85 247 / 0.24);
        animation-delay: -0.9s;
      }

      .boot-loader__logo-shell {
        position: relative;
        display: grid;
        width: clamp(78px, 17vw, 98px);
        height: clamp(78px, 17vw, 98px);
        place-items: center;
        overflow: hidden;
        border: 1px solid rgb(121 234 255 / 0.26);
        border-radius: 28%;
        background:
          radial-gradient(circle at 30% 20%, rgb(121 234 255 / 0.14), transparent 38%),
          linear-gradient(145deg, rgb(8 37 75 / 0.92), rgb(2 12 30 / 0.98));
        box-shadow:
          inset 0 1px 0 rgb(255 255 255 / 0.14),
          0 18px 44px -24px rgb(0 0 0 / 0.9),
          0 0 28px -12px rgb(25 214 255 / 0.56);
        animation: boot-logo-breathe 1.25s ease-in-out infinite alternate;
      }

      .boot-loader__logo {
        width: 90%;
        height: 90%;
        object-fit: contain;
        filter: drop-shadow(0 9px 22px rgb(8 125 255 / 0.34));
      }

      .boot-loader__brand {
        color: #dffbff;
        font-family: "Cinzel Decorative", Georgia, serif;
        font-size: clamp(15px, 4vw, 18px);
        font-weight: 900;
        letter-spacing: 0.05em;
        text-shadow: 0 0 16px rgb(25 214 255 / 0.42);
      }

      .boot-loader__brand span {
        margin-inline-start: 7px;
        color: #79eaff;
        font-family: Montserrat, Arial, sans-serif;
        font-size: 0.55em;
        letter-spacing: 0.38em;
      }

      .boot-loader__track {
        width: min(140px, 48vw);
        height: 3px;
        overflow: hidden;
        margin-top: 2px;
        border-radius: 999px;
        background: rgb(121 234 255 / 0.1);
      }

      .boot-loader__progress {
        display: block;
        width: 44%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, transparent, #25d9ff 34%, #3b82f6 68%, #c084fc);
        box-shadow: 0 0 14px rgb(25 214 255 / 0.72);
        animation: boot-progress 820ms cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }

      @keyframes boot-logo-breathe {
        from { transform: translateY(2px) scale(0.97); filter: brightness(0.92); }
        to { transform: translateY(-2px) scale(1.015); filter: brightness(1.08); }
      }

      @keyframes boot-ring-pulse {
        0% { opacity: 0; transform: scale(0.78); }
        42% { opacity: 0.75; }
        100% { opacity: 0; transform: scale(1.12); }
      }

      @keyframes boot-progress {
        from { transform: translateX(-120%); }
        to { transform: translateX(275%); }
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-loader__mark::before,
        .boot-loader__mark::after,
        .boot-loader__logo-shell,
        .boot-loader__progress {
          animation: none;
        }
      }

    </style>
  </head>
  <body>
    <div id="app-boot-loader" aria-hidden="true">
      <div class="boot-loader__content">
        <div class="boot-loader__mark">
          <span class="boot-loader__logo-shell">
            <img class="boot-loader__logo" src="/src/assets/logo.PNG" alt="N&amp;A HUB" />
          </span>
        </div>
        <div class="boot-loader__brand">N&amp;A <span>HUB</span></div>
        <div class="boot-loader__track"><span class="boot-loader__progress"></span></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
