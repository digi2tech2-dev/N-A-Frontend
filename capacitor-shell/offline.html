<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>N&amp;A</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #f8fafc; color: #0f172a; }
      main { width: min(30rem, calc(100% - 3rem)); text-align: center; }
      button { border: 0; border-radius: .8rem; padding: .8rem 1.2rem; background: #7c3aed; color: white; font: inherit; font-weight: 700; }
      @media (prefers-color-scheme: dark) { body { background: #09090f; color: #f8fafc; } }
    </style>
  </head>
  <body>
    <main>
      <h1>تعذّر الاتصال</h1>
      <p>تحقق من اتصال الإنترنت ثم حاول مرة أخرى.</p>
      <button type="button" onclick="location.reload()">إعادة المحاولة</button>
    </main>
  </body>
</html>
